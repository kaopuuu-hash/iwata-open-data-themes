<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仮想街いわた GISマップ — 町別人口</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  body { font-family: "Hiragino Kaku Gothic ProN","Meiryo",sans-serif; margin:0; padding:0; color:#333; }
  #map { width:100%; height:100vh; }
  .info { padding:8px 12px; background:#fff; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.2); font-size:13px; line-height:1.5; }
  .info h4 { margin:0 0 6px; font-size:14px; }
  .legend { padding:8px 12px; background:#fff; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.2); font-size:12px; line-height:1.6; }
  .legend i { width:14px; height:14px; float:left; margin-right:6px; opacity:0.8; border:1px solid #999; }
  .titlebar { position:absolute; top:10px; left:50px; z-index:1000; background:#fff; padding:8px 14px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.2); font-size:14px; font-weight:bold; }
  .source { position:absolute; bottom:8px; left:10px; z-index:1000; background:rgba(255,255,255,0.85); padding:4px 8px; border-radius:4px; font-size:11px; color:#555; }
</style>
</head>
<body>
<div class="titlebar">仮想街いわた GISマップ — 町別人口 (2020年国勢調査)</div>
<div id="map"></div>
<div class="source">出典: e-Stat 統計地理情報システム (r2ka22, 2020-10-01) / 公開オープンデータ。人口は町丁字別国勢調査人口 (JINKO)。</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const GEOJSON_URL = 'data/town_population.geojson';

function colorFor(pop) {
  return pop > 3000 ? '#800026' :
         pop > 2000 ? '#BD0026' :
         pop > 1000 ? '#E31A1C' :
         pop > 500  ? '#FC4E2A' :
         pop > 200  ? '#FD8D3C' :
         pop > 100  ? '#FEB24C' :
         pop > 0    ? '#FED976' : '#f0f0f0';
}

const map = L.map('map').setView([34.72, 137.85], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let geojsonLayer;
const info = L.control();
info.onAdd = function() {
  this._div = L.DomUtil.create('div', 'info');
  this.update();
  return this._div;
};
// innerHTML uses trusted local GeoJSON properties (S_NAME, JINKO, SETAI, AREA); no user input. Safe.
info.update = function(props) {
  const d = props ? props : null;
  this._div.innerHTML = d
    ? '<h4>' + d.S_NAME + '</h4>' +
      '人口: ' + (d.JINKO != null ? d.JINKO.toLocaleString() : '—') + ' 人<br>' +
      '世帯: ' + (d.SETAI != null ? d.SETAI.toLocaleString() : '—') + ' 世帯<br>' +
      '面積: ' + (d.AREA != null ? (d.AREA/1e6).toFixed(2) : '—') + ' km²'
    : '<h4>仮想街いわた 町別人口マップ</h4>地域にマウスを重ねると情報が表示されます。';
};
info.addTo(map);

function style(feature) {
  return {
    fillColor: colorFor(feature.properties.JINKO || 0),
    weight: 1,
    opacity: 1,
    color: '#666',
    dashArray: '',
    fillOpacity: 0.7
  };
}

function highlightFeature(e) {
  const layer = e.target;
  layer.setStyle({ weight:3, color:'#333', dashArray:'', fillOpacity:0.9 });
  layer.bringToFront();
  info.update(layer.feature.properties);
}

function resetHighlight(e) {
  geojsonLayer.resetStyle(e.target);
  info.update();
}

function onEachFeature(feature, layer) {
  layer.on({ mouseover: highlightFeature, mouseout: resetHighlight, click: highlightFeature });
  layer.bindPopup(
    '<b>' + feature.properties.S_NAME + '</b><br>' +
    '人口: ' + (feature.properties.JINKO != null ? feature.properties.JINKO.toLocaleString() : '—') + ' 人<br>' +
    '世帯: ' + (feature.properties.SETAI != null ? feature.properties.SETAI.toLocaleString() : '—') + ' 世帯<br>' +
    '面積: ' + (feature.properties.AREA != null ? (feature.properties.AREA/1e6).toFixed(2) : '—') + ' km²'
  );
}

fetch(GEOJSON_URL)
  .then(r => r.json())
  .then(data => {
    geojsonLayer = L.geoJSON(data, { style: style, onEachFeature: onEachFeature }).addTo(map);
    map.fitBounds(geojsonLayer.getBounds());
  })
  .catch(err => {
    console.error('GeoJSON load error:', err);
    document.getElementById('map').innerHTML = '<div style="padding:20px;color:#c00;">地図データの読み込みに失敗しました。相対パスを確認してください。</div>';
  });

const legend = L.control({position:'bottomright'});
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  const grades = [0,100,200,500,1000,2000,3000];
  const labels = ['<strong>人口 (人)</strong>'];
  for (let i = 0; i < grades.length; i++) {
    const from = grades[i];
    const to = grades[i+1];
    labels.push('<i style="background:' + colorFor(from+1) + '"></i> ' +
      from + (to ? '&ndash;' + to : '+'));
  }
  div.innerHTML = labels.join('<br>');
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
